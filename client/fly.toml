# fly.toml app configuration file generated for offshoot on 2026-01-24T16:06:41+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'offshoot'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
